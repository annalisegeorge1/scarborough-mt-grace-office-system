services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smg_staging
      POSTGRES_USER: smg_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD}
    volumes:
      - smg_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smg_staging -d smg_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    env_file: ../.env.staging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  smg_staging_pg:

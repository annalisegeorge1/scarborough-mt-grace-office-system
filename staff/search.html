<!doctype html><html lang="en"><head><base href="/staff/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Search | Scarborough / Mt. Grace</title><link rel="stylesheet" href="production-ui.css"><script src="production-client.js" defer></script></head><body><header class="top"><span class="authline" data-auth>Checking session…</span><h1>Global Search</h1><div class="sub">Server-side search across authorized operational records.</div><div class="nav"><a href="index.html">Home</a><a href="workflow.html">Daily Work</a><a href="applications.html">Applications</a><a href="correspondence.html">Correspondence</a><a href="field.html">Field</a><a href="community.html">Community</a><a href="events.html">Events</a><a href="records.html">Records</a><a href="search.html" class="active">Search</a><a href="reports.html">Reports</a><a href="cms.html">Website</a><a href="sections.html">All Sections</a></div></header><main class="wrap"><div id="msg" class="notice">Search queries the central production database and respects role-based access.</div><section class="card"><h2>Find anything</h2><div class="toolbar"><input id="q" placeholder="Reference, resident/applicant, document, community matter, event, correspondence…" style="max-width:700px"><button class="btn gold" id="go">Search</button></div><div id="results"></div></section></main><script>const $=id=>document.getElementById(id);async function search(){const q=SMG.val('q');if(q.length<2)return SMG.msg('Enter at least two characters.','warn');try{const d=await SMG.api('/api/search?q='+encodeURIComponent(q));const r=d.results||[];$('results').innerHTML=r.length?`<div class="tablewrap"><table><thead><tr><th>Type</th><th>Reference</th><th>Title</th><th>Status / detail</th></tr></thead><tbody>${r.map(x=>`<tr><td>${SMG.esc(x.type)}</td><td><strong>${SMG.esc(x.label||'—')}</strong></td><td>${SMG.esc(x.title||'')}</td><td>${SMG.esc(x.subtitle||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matches.</div>'}catch(e){SMG.msg(e.message,'danger')}}$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});</script></body></html>

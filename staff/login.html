<!doctype html><html lang="en"><head><base href="/staff/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Sign In | Scarborough / Mt. Grace</title><link rel="stylesheet" href="production-ui.css"></head><body><main class="wrap" style="max-width:520px;padding-top:9vh"><section class="card"><h1 style="color:#0c2d52">Scarborough / Mt. Grace Staff Sign In</h1><p class="small">Use your individual staff account. Shared credentials should not be used.</p><div id="msg" class="notice">Enter your authorized staff credentials.</div><label>Email</label><input type="email" id="email" autocomplete="username"><label>Password</label><input type="password" id="password" autocomplete="current-password"><div class="toolbar"><button class="btn gold" id="login">Sign in</button><a class="btn light" href="/">Return to public website</a></div></section></main><script>const $=id=>document.getElementById(id);async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Sign in failed');sessionStorage.setItem('smg_v43_csrf',d.csrf||'');const n=new URLSearchParams(location.search).get('next');location.href=n&&n.startsWith('/staff/')?n:'/staff/index.html'}catch(e){$('msg').textContent=e.message;$('msg').className='notice danger'}}$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>

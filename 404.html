</head><body><a class="v73-skip" href="#main-content">Skip to main content</a><main id="main-content"><small>404 • PAGE NOT FOUND</small><h1>We couldn’t find that page.</h1><p>The link may have changed, or the page may no longer be available. Return to the District Office website or contact the office if you need assistance.</p><a href="index-self-contained.html">RETURN HOME</a><a class="alt" href="index-self-contained.html#contact-us">CONTACT THE OFFICE</a><button aria-label="Use dark mode" aria-pressed="false" class="v114-theme-toggle v115-theme-control v115-inline-theme" id="v114-theme-toggle" title="Use dark mode" type="button">☾ Dark</button></main><script id="v114-system-theme-js">
(function(){
'use strict';
const STORAGE='smg_theme_v112';
const body=document.body;
const btn=document.getElementById('v114-theme-toggle');
function apply(on,persist){
  body.classList.toggle('v112-dark',!!on);
  if(btn){
    btn.textContent=on?'☀ Light':'☾ Dark';
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Use light mode':'Use dark mode');
    btn.title=on?'Use light mode':'Use dark mode';
  }
  if(persist){try{localStorage.setItem(STORAGE,on?'dark':'light')}catch(e){}}
}
let saved=null;try{saved=localStorage.getItem(STORAGE)}catch(e){}
let initial=saved==='dark';
if(saved!=='dark'&&saved!=='light'){
  try{initial=!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}
}
apply(initial,false);
btn?.addEventListener('click',()=>apply(!body.classList.contains('v112-dark'),true));
})();
</script></body></html>
